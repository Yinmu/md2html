<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>humanview usage</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 675px; background: #fbfaf7; color: #111827; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .canvas { height: 100%; padding: 54px; display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
    .left { display: flex; flex-direction: column; justify-content: center; }
    .kicker { font-size: 22px; font-weight: 900; color: #d92d20; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 16px 0 24px; font-size: 76px; line-height: .98; letter-spacing: 0; }
    p { margin: 0; max-width: 460px; color: #4b5563; font-size: 27px; line-height: 1.45; }
    .panel { align-self: center; padding: 34px; border: 3px solid #111827; border-radius: 18px; background: #fff; box-shadow: 12px 12px 0 #111827; }
    .step { display: grid; grid-template-columns: 58px 1fr; gap: 18px; align-items: start; padding: 20px 0; border-bottom: 2px solid #e6e8eb; }
    .step:last-child { border-bottom: 0; }
    .num { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: #fff0a8; border: 2px solid #111827; font-weight: 950; font-size: 24px; }
    h2 { margin: 0 0 8px; font-size: 30px; line-height: 1.12; }
    code { display: inline-block; margin-top: 4px; padding: 6px 10px; border-radius: 10px; background: #111827; color: #fff; font-size: 21px; }
    .small { margin: 0; color: #667085; font-size: 22px; }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="left">
      <div class="kicker">HumanView</div>
      <h1>用法只有<br>一句话</h1>
      <p>把本地 Markdown、学习笔记、采集到的长文案，优先变成适合人类观看的 HTML 视图。</p>
    </section>
    <section class="panel">
      <div class="step"><div class="num">1</div><div><h2>安装 skill</h2><p class="small">放到 Codex / Claude Code 的 skills 目录</p></div></div>
      <div class="step"><div class="num">2</div><div><h2>把材料交给 agent</h2><p class="small">本地 md、网页文案、长笔记都可以</p></div></div>
      <div class="step"><div class="num">3</div><div><h2>直接说</h2><code>Use $humanview</code></div></div>
    </section>
  </main>
</body>
</html>
