<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>humanview prompt</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 675px; background: #fbfaf7; color: #111827; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .canvas { height: 100%; padding: 54px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 34px; align-items: center; }
    h1 { margin: 0 0 20px; font-size: 68px; line-height: 1; letter-spacing: 0; }
    p { margin: 0; color: #4b5563; font-size: 26px; line-height: 1.45; }
    .prompt { padding: 30px; border: 3px solid #111827; border-radius: 18px; background: #111827; color: #fff; box-shadow: 12px 12px 0 #d92d20; }
    .prompt span { display: inline-block; margin-bottom: 18px; padding: 6px 12px; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; color: #fff0a8; font-size: 18px; font-weight: 900; }
    pre { margin: 0; white-space: pre-wrap; font-size: 28px; line-height: 1.45; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .note { margin-top: 20px; display: grid; gap: 12px; }
    .note div { padding: 16px 18px; border: 2px solid #111827; border-radius: 14px; background: #fff; font-size: 24px; font-weight: 850; }
  </style>
</head>
<body>
  <main class="canvas">
    <section>
      <h1>给 AI agent<br>也要简单</h1>
      <p>不要写复杂需求。告诉它材料在哪，以及你要 humanview 输出即可。</p>
      <div class="note">
        <div>本地 md：给路径</div>
        <div>网页文案：先采集，再转视图</div>
        <div>输出：一个可打开的 HTML</div>
      </div>
    </section>
    <section class="prompt">
      <span>推荐提示词</span>
      <pre>Use $humanview to turn this article into a human-friendly HTML view.

Input: ./notes/article.md
Output: ./article-view.html</pre>
    </section>
  </main>
</body>
</html>
