<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 675px; background: #fbfaf7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #111827; }
    .card { width: 1120px; height: 595px; margin: 40px; padding: 46px; border: 2px solid #111827; border-radius: 18px; background: #fff8d8; box-shadow: 14px 14px 0 #111827; }
    .eyebrow { font-size: 20px; font-weight: 900; color: #d92d20; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 18px 0 30px; font-size: 64px; line-height: 1.05; letter-spacing: 0; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 34px; }
    .step { min-height: 210px; padding: 24px; border: 2px solid #111827; border-radius: 14px; background: #fff; }
    .num { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #111827; color: #fff; font-weight: 900; }
    h2 { margin: 22px 0 10px; font-size: 30px; }
    p { margin: 0; color: #4b5563; font-size: 23px; line-height: 1.35; }
    code { padding: 2px 8px; border-radius: 8px; background: #eef2ff; color: #111827; font-size: .9em; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Install</div>
    <h1>朋友只需要 3 步<br>就能装好 md2html</h1>
    <section class="steps">
      <div class="step"><span class="num">1</span><h2>克隆仓库</h2><p><code>git clone</code><br>拿到 skill 文件夹</p></div>
      <div class="step"><span class="num">2</span><h2>复制到 Codex</h2><p>放进<br><code>~/.codex/skills</code></p></div>
      <div class="step"><span class="num">3</span><h2>重启 Codex</h2><p>然后直接调用<br><code>$md2html</code></p></div>
    </section>
  </main>
</body>
</html>
