<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>humanview output</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 675px; background: #101828; color: #111827; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .canvas { height: 100%; padding: 48px; display: grid; gap: 24px; background: linear-gradient(135deg, #fbfaf7 0%, #fbfaf7 58%, #dbeafe 58%, #dbeafe 100%); }
    header { display: flex; align-items: end; justify-content: space-between; }
    .kicker { color: #d92d20; font-size: 20px; font-weight: 950; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: 62px; line-height: 1; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: stretch; }
    .map { padding: 28px; border: 3px solid #111827; border-radius: 18px; background: #fff; box-shadow: 10px 10px 0 #111827; display: grid; align-content: center; gap: 18px; }
    .map span { color: #667085; font-size: 18px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .map strong { font-size: 38px; line-height: 1.1; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card { min-height: 118px; padding: 18px; border: 2px solid #111827; border-radius: 14px; box-shadow: 6px 6px 0 rgba(17,24,39,.9); }
    .card:nth-child(1){background:#ffd6c9}.card:nth-child(2){background:#c9f7df}.card:nth-child(3){background:#fff0a8}.card:nth-child(4){background:#eadcff}
    .card b { display: block; margin-bottom: 8px; font-size: 24px; }
    .card p { margin: 0; color: #344054; font-size: 19px; line-height: 1.35; }
    .side { display: grid; gap: 16px; }
    .pill { padding: 20px; border: 2px solid #111827; border-radius: 16px; background: #fff; }
    .pill b { display: block; font-size: 28px; }
    .pill span { color: #667085; font-size: 20px; }
  </style>
</head>
<body>
  <main class="canvas">
    <header>
      <div><div class="kicker">Fixed Template + Dynamic Content</div><h1>不是把 MD 变漂亮<br>而是换一种理解界面</h1></div>
    </header>
    <section class="grid">
      <div class="map">
        <span>中心命题</span>
        <strong>先给人一张地图，再让人回到原文验证细节。</strong>
        <div class="cards">
          <div class="card"><b>极简版</b><p>每节只留一个判断。</p></div>
          <div class="card"><b>精炼版</b><p>保留要点、证据和含义。</p></div>
          <div class="card"><b>核心概念</b><p>把长文变成可复习对象。</p></div>
          <div class="card"><b>完整正文</b><p>细节仍可展开，不丢源文。</p></div>
        </div>
      </div>
      <div class="side">
        <div class="pill"><b>人类观看</b><span>颜色、卡片、层级、导航</span></div>
        <div class="pill"><b>Agent 执行</b><span>一个 skill，一句 prompt，一个 HTML</span></div>
        <div class="pill"><b>本地优先</b><span>Node.js，无 npm 依赖</span></div>
      </div>
    </section>
  </main>
</body>
</html>
